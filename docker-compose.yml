# ==============================================================================
# Autonomous Data Analyst — Docker Compose
# ==============================================================================
# Brings up the Streamlit application + local Ollama together.
# ==============================================================================

services:
  ada-ui:
    build: .
    container_name: ada-streamlit-ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - ADA_API_URL=http://ada-api:5000
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    depends_on:
      - ada-api
    restart: unless-stopped

  ada-api:
    build: .
    container_name: ada-flask-api
    command: python api.py
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - FLASK_ENV=production
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ada-n8n-automation
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - ADA_API_ENDPOINT=http://ada-api:5000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./runs:/data/runs
      - ./n8n/workflows:/data/workflows
    depends_on:
      - ada-api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ada-ollama-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  n8n_data:
  ollama_data:
