# Autonomous Data Analyst — Global Configuration
# All important thresholds and parameters must be defined here.

max_upload_size_mb: 200

llm:
  provider: ollama
  model: llama3.1:8b
  host: http://localhost:11434
  max_tokens_per_call: 500
  temperature: 0.2
  timeout_seconds: 60

security:
  max_llm_tokens_per_run: 20000

eda:
  max_charts: 6

ml:
  min_rows_for_ml: 30
  min_rows_per_class: 5
  leakage_threshold: 0.95
  train_test_split: 0.8
  random_state: 42
  min_rows_xgboost: 500
  class_imbalance_threshold: 0.90
  metric_leakage_f1_threshold: 0.98
  metric_leakage_r2_threshold: 0.98

insights:
  min_insights: 3
  max_insights: 6
  grounding_tolerance: 0.05
  temperature: 0.2
  max_tokens: 800

pipeline:
  runs_dir: runs
  save_dio_json: true
  log_level: INFO

chat:
  enabled: true
  max_context_tokens: 1200
  temperature: 0.1
  allow_deterministic_aggregations: true
  safe_operations:
    - mean
    - sum
    - count
    - min
    - max
    - value_counts
    - groupby_mean
